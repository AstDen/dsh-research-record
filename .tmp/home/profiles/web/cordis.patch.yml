    # Ready-made delegation tool: always available (fixed route + slim preset),
    # independent of the per-Session model-selection policy above.
    - id: tool-subagent-local
      name: "@deepseek-ai/dsh-tool-subagent"
      config:
        provider: spawn
        toolName: subagent_local
        agentOptions:
          provider: local
          # The 4B is the only local model that holds a 32k window on this GPU;
          # the tool catalogue alone costs ~16k tokens, so 12288 is not enough.
          model: qwen3-4b-instruct-2507
          maxTokens: 4096
        agentPreset: local
        # 1 = the child sits at depth 1 and may not delegate any further.
        maxDepth: 1
- id: dsh-context
  name: dsh-context
  config:
    defaultOverviewRange: 30d

- id: openfoam-workbench
  name: '@yakovlev-i-a/dsh-openfoam-workbench'
