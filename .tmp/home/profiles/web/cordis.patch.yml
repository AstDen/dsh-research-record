# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode:
        apiKeyEnv: OPENCODE_API_KEY
      # Local model on the Windows box (gpu-box / 192.168.8.119), reached
      # through the SSH tunnel 127.0.0.1:11435 -> 127.0.0.1:1234 (LM Studio).
      local:
        displayName: Local LM Studio (gpu-box)
        api: openai-completions
        baseURL: http://127.0.0.1:11435/v1
        headers:
          Authorization: Bearer lm-studio
        # Windows must match what LM Studio ACTUALLY loads, otherwise ACP
        # preflight rejects the request with CONTEXT_WINDOW_EXCEEDED.
        # 4B: fits the P104-100 8GB card fully at 32768, reliably.
        # 9B: the engine crashes above ~12288 (exitCode=3221226505), so 12288.
        defaultContextWindow: 32768
        defaultMaxTokens: 4096
        models:
          - id: qwen3.5-9b-kimi-k3-distilled
            name: Qwen3.5 9B (local)
            contextWindow: 12288
            maxTokens: 2048
            input: [ text ]
          - id: qwen3-4b-instruct-2507
            name: Qwen3 4B Instruct (local, fast)
            contextWindow: 32768
            maxTokens: 4096
            input: [ text ]
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: deepseek-search-api
    fetchProvider: deepseek-fetch-api
- id: plugin-market
  name: "@deepseek-ai/dsh-plugin-market"
  config:
    indexes:
      - http://127.0.0.1:8787/index.json
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark

# Allow fresh top-level Sessions to pick the local route for child Agents.
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: local
        model: qwen3.5-9b-kimi-k3-distilled
      - provider: local
        model: qwen3-4b-instruct-2507
      - provider: deepseek-official
        model: deepseek-flash
      # OpenCode Zen free routes (catalog: pi-ai opencode.json).
      # big-pickle: 200k ctx / 32k out, text-only, reasoning + tools, cost 0.
      # Free tier is account-quota limited: HTTP 429 FreeUsageLimitError with
      # Retry-After ~20h once the daily allowance is spent. Good for cheap
      # fan-out (grep/поиск/черновики), not for private data.
      - provider: opencode
        model: big-pickle
      - provider: opencode
        model: deepseek-v4.1-flash-free

- insert:
    # Slim child preset for small local models: the standard preset's plan-mode
    # and workflow prompts are far too heavy for a 9B on a 16k window.
    - id: preset-local
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: local
        name: Local (LM Studio)
        description: Slim preset for small local models over the SSH tunnel
        order: 2
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: You are a coding agent powered by the {{model}} model. Work in small
                steps, keep answers short, and use the tools instead of
                guessing.
          - id: time-context
            name: "@deepseek-ai/dsh-time-context"
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"
          # Small local models cannot afford the inherited host catalogue.
          # Only tools registered as GLOBAL can be masked (bash/read/write/edit/
          # glob/grep/working_directory are scoped to this preset and stay).
          # To re-enable one, delete its line from deny and the child sees it again.
          - id: tool-limit
            name: ./plugins/tool-limit.js
            config:
              # Deny EVERY global tool; only the preset's own 8 tools stay.
              # Regenerate from a child header after installing bundles that add tools.
              deny:
                - acp_cache
                - acp_read_original_image
                - acp_status
                - agent_teams_add_member
                - agent_teams_amend_task
                - agent_teams_approve
                - agent_teams_claim_task
                - agent_teams_create
                - agent_teams_create_task
                - agent_teams_delete
                - agent_teams_edit_plan
                - agent_teams_reassign_task
                - agent_teams_remove_member
                - agent_teams_resume
                - agent_teams_send_message
                - agent_teams_status
                - agent_teams_update_task
                - audio_convert
                - audio_probe
                - audio_transcribe
                - compress
                - create_worktree
                - data_clean
                - data_profile
                - data_report
                - data_verify
                - decompress
                - fluent_case_generate
                - fluent_case_interview
                - fluent_case_list
                - fluent_case_plan
                - fluent_case_profiles
                - fluent_case_run
                - fluent_case_status
                - fluent_case_validate
                - fluent_kb_get
                - fluent_kb_search
                - fluent_plugin_update
                - fluent_task_log
