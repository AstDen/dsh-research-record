      com: /usr/lib/openfoam/openfoam2512
    defaultDistribution: com
    paraviewExe: /opt/ParaView-6.2.1-MPI-Linux-Python3.12-x86_64/bin/paraview
    paraviewPython: /opt/ParaView-6.2.1-MPI-Linux-Python3.12-x86_64/bin/pvpython
    pythonPath: /mnt/HDD-2Tb-PC-Danii/Science_Projects/Mesh_3D_pore_scale/.venv/bin/python
    caseRoots:
      - /mnt/HDD-2Tb-PC-Danii/Science_Projects/Mesh_3D_pore_scale/experiments
      - /mnt/HDD-2Tb-PC-Danii/Science_Projects/Mesh_3D_pore_scale/cases

